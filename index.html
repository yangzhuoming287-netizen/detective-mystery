<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>逆证 · 侦探推理</title>
<meta name="theme-color" content="#0a0f1a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%231b2438'/><circle cx='14' cy='13' r='6' fill='none' stroke='%23ffd76e' stroke-width='2.5'/><path d='M18 18l7 7' stroke='%23ffd76e' stroke-width='3'/></svg>">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05080f;color:#eef2f8;overflow:hidden;
 font-family:-apple-system,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* ---------- 场景区 ---------- */
#stage{position:relative;flex:1;overflow:hidden;background:#0a0f1a}
#sceneBg{position:absolute;inset:0;background-size:cover;background-position:center;
 filter:brightness(.72) saturate(1.05);transition:background-image .3s}
#charL,#charR{position:absolute;bottom:0;width:46%;height:88%;background-size:contain;
 background-repeat:no-repeat;background-position:bottom center;transition:opacity .25s,transform .25s;opacity:0}
#charL{left:-3%}#charR{right:-3%}
#charL.on,#charR.on{opacity:1}
#charC{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:60%;height:92%;
 background-size:contain;background-repeat:no-repeat;background-position:bottom center;opacity:0;transition:opacity .25s}
#charC.on{opacity:1}
#charR.small,#charL.small{height:70%;opacity:.85}
/* 场景里的物件：不显示名称，玩家自己找 */
.obj{position:absolute;cursor:zoom-in;z-index:7;transition:transform .12s,filter .12s;filter:drop-shadow(0 5px 10px #000b)}
.obj img{width:100%;border-radius:9px;border:1px solid #ffffff33;display:block}
.zone{position:absolute;cursor:zoom-in;z-index:7;border-radius:10px;background:transparent;transition:box-shadow .15s,background .15s}
.zone:hover{box-shadow:0 0 0 2px #ffd76e99 inset;background:#ffd76e14}
.zone:active{box-shadow:0 0 0 3px #ffd76e inset;background:#ffd76e22}
.obj.miss{background:radial-gradient(circle,#ffd76e22,transparent 70%);border:1px dashed #ffd76e66;border-radius:9px;width:44px!important;height:44px}
.obj:active{transform:scale(1.06)!important;filter:brightness(1.15) drop-shadow(0 6px 14px #000)}
#stage{cursor:crosshair}
#charStrip{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:9px;flex-wrap:wrap;z-index:12}
.cchip{display:flex;align-items:center;gap:8px;background:#0a1120ee;border:1px solid #3c5178;border-radius:26px;padding:4px 14px 4px 4px;cursor:pointer;backdrop-filter:blur(3px)}
.cchip img{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:top center;border:1px solid #5d7fb8}
.cchip span{font-size:12.5px;color:#eaf2ff;white-space:nowrap}
.cchip:hover{background:#243b63;border-color:#ffd76e}
.cchip:active{transform:scale(.97)}
#zoomLayer{position:absolute;inset:0;z-index:14;pointer-events:none}
.zoomcard{position:absolute;width:132px;pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%);background:#0a1120f2;border:2px solid #ffd76e;border-radius:10px;padding:4px;box-shadow:0 8px 26px #000c;animation:zpop .3s ease-out}
@keyframes zpop{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.zoomcard img{width:100%;border-radius:7px;display:block}
.zoomcard span{display:block;font-size:11px;color:#ffe8a8;text-align:center;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zoomcard em{display:block;font-size:10px;color:#e0a94a;text-align:center;font-style:normal}
.zone{z-index:7}
#charL,#charR,#charC{z-index:9}
/* 调查热点 */
.hot{position:absolute;border-radius:50%;border:2px solid #ffd76e;background:#ffd76e33;
 display:flex;align-items:center;justify-content:center;font-size:11px;color:#ffe8a8;
 animation:pulse 1.6s infinite;cursor:pointer;z-index:6;text-align:center;line-height:1.15;padding:2px}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ffd76e66}70%{box-shadow:0 0 0 14px #ffd76e00}100%{box-shadow:0 0 0 0 #ffd76e00}}
/* ---------- 对话框 ---------- */
#dlg{position:relative;flex:0 0 auto;min-height:34vh;max-height:46vh;background:linear-gradient(180deg,#141d33f2,#0a1120f8);
 border-top:2px solid #3c5178;padding:12px 14px 62px;display:none}
#dlg.on{display:block}
#speaker{position:absolute;top:-16px;left:14px;background:#243b63;border:1px solid #5d7fb8;
 color:#ffe8a8;font-size:13px;font-weight:700;padding:4px 14px;border-radius:6px;letter-spacing:1px}
#dtext{font-size:15.5px;line-height:1.75;min-height:5.2em;white-space:pre-wrap}
#dtext .cursor{display:inline-block;width:8px;background:#ffd76e;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#dnext{position:absolute;right:14px;bottom:12px;font-size:12.5px;color:#9db0d0}
#choices{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.choice{background:#1b2745;border:1px solid #3c5178;border-radius:8px;padding:9px 12px;font-size:14px;cursor:pointer}
.choice:active{background:#2a3c66}
/* ---------- 底栏按钮 ---------- */
#hud{position:absolute;right:10px;top:10px;display:flex;gap:7px;z-index:20;flex-wrap:wrap;justify-content:flex-end}
.hbtn{background:#141d33e6;border:1px solid #3c5178;color:#cfe0ff;border-radius:8px;padding:8px 12px;
 font-size:12.5px;font-family:inherit;cursor:pointer;backdrop-filter:blur(3px)}
.hbtn:active{background:#26375c}
.hbtn.gold{border-color:#c9a227;color:#ffe8a8}
.hbtn.red{border-color:#c05050;color:#ffd8d8}
#hud2{position:absolute;left:10px;top:10px;z-index:20}
#locName{background:#0a1120e6;border:1px solid #3c5178;border-radius:8px;padding:7px 12px;font-size:12.5px;color:#cfe0ff}
/* ---------- 弹层 ---------- */
#modal{position:fixed;inset:0;background:#000c;z-index:60;display:flex;align-items:center;justify-content:center;padding:14px}
#mbox{background:#101a2e;border:1px solid #3c5178;border-radius:12px;max-width:520px;width:100%;max-height:84vh;overflow:auto;padding:14px}
#mbox h3{margin:0 0 10px;font-size:15px;color:#ffe8a8}
.evrow{display:flex;gap:10px;align-items:flex-start;background:#0b1425;border:1px solid #2a3c5e;border-radius:9px;padding:9px;margin-bottom:7px;cursor:pointer}
.evrow:active{background:#16233c}
.evimg{display:inline-block;border-radius:8px;background-size:cover;background-position:center;background-color:#1b2745;border:1px solid #3a5178;position:relative;overflow:hidden}
.evimg i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:19px}
.evrow .ic{width:38px;height:38px;border-radius:8px;background:#1b2745;display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto}
.evrow b{font-size:13.5px;color:#eaf2ff}
.evrow small{display:block;color:#8fa4c8;font-size:11.5px;margin-top:3px;line-height:1.5}
.btn{background:#243b63;color:#fff;border:1px solid #5d7fb8;border-radius:8px;padding:9px 16px;font-size:13.5px;font-family:inherit;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.g{background:#1a2740;color:#a9c0e8;border-color:#2f4468}
.btn.y{background:#6b5313;color:#ffe8a8;border-color:#c9a227}
/* ---------- 法庭 ---------- */
#courtBar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:9px 12px;background:#0a1120f0;border-top:2px solid #3c5178;z-index:22}
#courtBar .btn{flex:1}
#obj{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:70;opacity:0}
#obj div{font-size:44px;font-weight:900;color:#ff3b3b;text-shadow:0 0 22px #ff0000,4px 4px 0 #fff;letter-spacing:4px;transform:scale(.6) rotate(-8deg)}
#obj.on{opacity:1;animation:objin .55s ease-out}
@keyframes objin{0%{opacity:0;transform:scale(2.4)}30%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(1)}}
/* ---------- 标题/菜单 ---------- */
#title{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#1b2745,#05080f 70%);z-index:80;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}
#title h1{margin:0;font-size:34px;letter-spacing:8px;color:#fff;text-shadow:0 0 24px #ffd76e66}
#title p{margin:0;color:#8fa4c8;font-size:13px;letter-spacing:2px}
.caseCard{background:#101a2e;border:1px solid #3c5178;border-radius:10px;padding:12px;width:100%;max-width:460px;cursor:pointer}
.caseCard:active{background:#16233c}
.caseCard b{font-size:15px;color:#ffe8a8}
.caseCard small{display:block;color:#8fa4c8;font-size:12px;margin-top:4px;line-height:1.55}
.caseCard .tag{float:right;font-size:11px;padding:2px 8px;border-radius:10px;background:#243b63;color:#cfe0ff}
.caseCard.lock{opacity:.45}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#101a2eee;border:1px solid #5d7fb8;
 color:#eaf2ff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:90;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
.hide{display:none !important}
</style>
</head>

 {q:'二十年前的医疗事故呢？',a:[

</script><script>
/* ===================== 推理游戏引擎 ===================== */
var G={caseId:null, scene:null, ev:[], seen:{}, flags:{}, phase:'explore', talk:null, qIdx:0,
  court:null, penalty:3, log:[], unlocked:1, done:{}};
var DLG={lines:[], i:0, typing:false, timer:null, done:null, choices:null};
function $(id){ return document.getElementById(id); }
function el(tag,cls,txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function ensure(id){ var e=$(id); if(!e){ e=document.createElement('div'); e.id=id; document.body.appendChild(e); } return e }
/* 证物配图：物证=AI 插画；证言=说话人立绘；都没有才退回 emoji */
function evSpeaker(id){
  var e=EVS[id]; if(!e||e.type!=='testimony') return null;
  var key=e.name.replace(/的证词|的失态|谈.*/,'');
  var hit=Object.keys(CHARS).filter(function(c){
    var n=CHARS[c].name.replace(/（[^）]*）/,'');
    return n && (e.name.indexOf(n)===0 || key.indexOf(n)===0) })[0];
  return hit||null;
}
function evIcon(id,size){
  var e=EVS[id]; if(!e) return '';
  var px=size||44;
  var sp=evSpeaker(id);
  if(sp) return '<span class="evimg" style="width:'+px+'px;height:'+px+'px;background-image:url(img/'+sp+'.jpg)"></span>';
  return '<span class="evimg" style="width:'+px+'px;height:'+px+'px;background-image:url(ev/'+id+'.jpg)"><i>'+(e.icon||'?')+'</i></span>';
}
function toast(t){ var e=$('toast'); e.textContent=t; e.className='on'; clearTimeout(e._t); e._t=setTimeout(function(){e.className=''},1800) }
function saveLS(){ try{ localStorage.setItem('mystery_progress', JSON.stringify({unlocked:G.unlocked,done:G.done})) }catch(e){} }
function loadLS(){ try{ var d=JSON.parse(localStorage.getItem('mystery_progress')||'{}'); if(d.unlocked) G.unlocked=d.unlocked; if(d.done) G.done=d.done }catch(e){} }
function caseOf(id){ return CASES.filter(function(c){return c.id===id})[0] }
function charOf(id){ return CHARS[id]||{name:id,img:id} }
function hasEv(id){ return G.ev.indexOf(id)>=0 }
function addEv(id){
  if(hasEv(id)) return;
  G.ev.push(id);
  var e=EVS[id];
  logAdd('获得'+(e&&e.type==='testimony'?'证言':'证物')+'「'+(e?e.name:id)+'」');
  try{ evCard(id) }catch(err){}
}
/* 新证物卡片 */
function evCard(id){
  var e=EVS[id]; if(!e) return;
  var isT=(e.type==='testimony');
  var h='<div style="text-align:center"><div style="font-size:12px;color:#c9a227;letter-spacing:2px">'+(isT?'获得证言':'获得证物')+'</div>'+
    '<div style="margin:10px auto">'+evIcon(id,132)+'</div>'+
    '<div style="font-size:15.5px;font-weight:700;color:#ffe8a8">'+e.name+'</div>'+
    '<div style="color:#cfe0ff;font-size:12.5px;line-height:1.75;margin-top:8px;text-align:left">'+e.desc+'</div>'+
    (e.fake?'<div style="color:#e0a94a;font-size:11.5px;margin-top:8px">※ 来源存疑，需要进一步核实</div>':'')+
    '</div><div style="text-align:center;margin-top:14px"><button class="btn" id="evok">收下</button></div>';
  var box=$('mbox');
  box.innerHTML=h; $('modal').className='';
  box.onclick=function(ev){ var t=ev.target.closest?ev.target.closest('#evok'):null; if(t) closeModal() };
  beep(660,0.08,'sine'); beep(990,0.1,'sine',0.08);
}
function logAdd(t){ G.log.push(t); if(G.log.length>200) G.log.shift() }
/* ---------- 对话机 ---------- */
function runLines(lines, done){
  DLG.lines=lines||[]; DLG.i=0; DLG.done=done||null; DLG.choices=null;
  dlgShow(true); nextLine();
}
function nextLine(){
  var L=DLG.lines[DLG.i];
  if(!L){ dlgShow(false); var d=DLG.done; DLG.done=null; if(d) d(); return }
  if(L.ev) addEv(L.ev);
  if(L.showEv && hasEv(L.showEv)){
    var se=EVS[L.showEv];
    L.text=(L.text||'')+'\n\n［证物：'+se.name+'］';
  }
  if(L.flag) G.flags[L.flag]=true;
  if(L.act){ L.act(); }
  showSpeaker(L.who);
  if(L.choices){ DLG.choices=L.choices; typeText(L.text||'', function(){ renderChoices(L.choices) }); return }
  DLG.choices=null;
  typeText(L.text||'', null);
}
function typeText(t, cb){
  var e=$('dtext'); e.innerHTML=''; DLG.typing=true; var i=0;
  clearInterval(DLG.timer);
  DLG.timer=setInterval(function(){
    i+=1; e.textContent=t.slice(0,i);
    if(i>=t.length){ clearInterval(DLG.timer); DLG.typing=false; if(cb) cb() }
  },18);
}
function renderChoices(cs){
  var box=$('choices'); box.innerHTML='';
  cs.forEach(function(c){
    var b=el('div','choice',c.t);
    b.onclick=function(){ box.innerHTML=''; if(c.act) c.act(); else { DLG.i++; nextLine() } };
    box.appendChild(b);
  });
}
function advance(){
  if(DLG.typing){ clearInterval(DLG.timer); DLG.typing=false; $('dtext').textContent=DLG.lines[DLG.i].text||'';
    if(DLG.choices) renderChoices(DLG.choices); return }
  if(DLG.choices) return;
  DLG.i++; nextLine();
}
function dlgShow(on){ $('dlg').className=on?'on':'' }
function showSpeaker(id){
  var sp=$('speaker');
  if(!id){ sp.style.display='none'; return }
  sp.style.display=''; sp.textContent=charOf(id).name;
  showChar(id);
}
function charColor(id){ var h=0; for(var i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))%360; return 'hsl('+h+',28%,26%)' }
function bgOf(f){ return 'url(img/'+f+'.jpg), linear-gradient(180deg,'+charColor(f)+',#0a0f1a)' }
function showChar(id){
  var c=charOf(id); ['charL','charR','charC'].forEach(function(k){ $(k).className='' });
  var img=bgOf(c.img||id);
  if(c.side==='L'){ $('charL').style.backgroundImage=img; $('charL').className='on' }
  else if(c.side==='R'){ $('charR').style.backgroundImage=img; $('charR').className='on' }
  else { $('charC').style.backgroundImage=img; $('charC').className='on' }
}
function clearChars(){ ['charL','charR','charC'].forEach(function(k){ $(k).className='' }) }
/* ---------- 案件流程 ---------- */
function startCase(cid){
  var C=caseOf(cid); if(!C) return;
  G.caseId=cid; G.phase='explore'; G.ev=[]; G.seen={}; G.flags={}; G.talk=null; G.log=[];
  G.penalty=3; G.court=null; G.scene=C.scenes[0].id;
  ensure('title').classList.add('hide');
  bindStageSearch();
  renderScene();
  runLines(C.intro, function(){ G.phase='explore'; renderAll() });
}
function curCase(){ return caseOf(G.caseId) }
function curScene(){ var C=curCase(); return C.scenes.filter(function(s){return s.id===G.scene})[0] }
function bindStageSearch(){
  var st=$('stage');
  if(st._bound) return; st._bound=true;
  st.addEventListener('click', function(e){
    if(e.target.closest && e.target.closest('.obj')) return;
    searchBlank();
  });
}
function renderScene(){
  var s=curScene(); if(!s) return;
  $('sceneBg').style.backgroundImage='url(scene4/'+G.caseId+'_'+s.id+'.jpg), url(scene3/'+G.caseId+'_'+s.id+'.jpg), url(scene2/'+G.caseId+'_'+s.id+'.jpg), url(scene/'+G.caseId+'_'+s.id+'_v2.jpg), url(img/'+s.bg+'.jpg), '+
    'linear-gradient(180deg,'+charColor(s.bg)+',#0a0f1a)';
  $('locName').textContent=s.name;
  clearChars(); removeHots();
  (s.chars||[]).forEach(function(cid){
    var c=charOf(cid);
    var d=el('div',null); d.style.cssText='position:absolute;bottom:0;width:30%;height:62%;background-size:contain;background-repeat:no-repeat;background-position:bottom center;cursor:pointer;z-index:5';
    d.style.backgroundImage='url(img/'+(c.img||cid)+'.jpg)';
    d.style.left=(c.x!==undefined?c.x:(c.side==='L'?4:66))+'%';
    d.onclick=function(){ talkTo(cid) };
    $('stage').appendChild(d);
  });
  renderHots(); renderHud(); if(DLG.lines.length===0) dlgShow(false);
}
function removeHots(){ Array.prototype.slice.call(document.querySelectorAll('.hot')).forEach(function(h){ h.remove() }) }
function renderHots(){
  var s=curScene(); if(!s||G.phase!=='explore') return;
  (s.hots||[]).forEach(function(h,i){
    if(G.seen[G.scene+'_'+i]) return;
    // 物件已经画在场景图里，这里只放隐形命中区；鼠标移上去才有一圈极淡提示
    var d=el('div','zone');
    var w=(h.w||0.10)*100; if(w<6) w=6; if(w>13) w=13;
    d.style.left=((h.x-w/200)*100)+'%';
    d.style.top=((h.y-w/200)*100)+'%';
    d.style.width=w+'%'; d.style.height=w+'%';
    d.setAttribute('data-ev',h.ev||''); d.setAttribute('data-label',h.label||'');
    d.onclick=function(e){ e.stopPropagation(); examine(h,i) };
    $('stage').appendChild(d);
  });
  var cnt=$('objCount');
  if(cnt){
    var total=(s.hots||[]).length, got=0;
    (s.hots||[]).forEach(function(h,i){ if(G.seen[G.scene+'_'+i]) got++ });
    cnt.textContent='本场景已发现 '+got+' / '+total;
  }
}
var BLANK=['这里积了一层薄灰，什么也没有。','墙纸的接缝翘起来一点，仅此而已。','窗外是白茫茫一片，没有脚印。','地毯上一道旧痕，看得出是家具挪动留下的。','空气里有股霉味，但找不到源头。','这儿什么都没有。再仔细看看别处。'];
function examine(h,i){
  G.seen[G.scene+'_'+i]=true; removeHots();
  if(h.ev) addEv(h.ev);
  if(h.flag) G.flags[h.flag]=true;
  var title=h.label?('【发现了什么】\n'):'';
  var lines=[{who:null,text:title+(h.look||'……没什么特别的。')}];
  runLines(lines, function(){ renderHots() });
}
/* 点空场景：只给一句模糊反馈 */
function searchBlank(){
  if(G.phase!=='explore'||DLG.lines.length) return;
  runLines([{who:null,text:BLANK[Math.floor(Math.random()*BLANK.length)]}], function(){ renderHots() });
}
function talkTo(cid){
  var C=curCase();
  var t=(C.talks||[]).filter(function(x){return x.id===cid})[0];
  if(!t){ runLines([{who:cid,text:'（他/她没有想说的。）'}]); return }
  G.phase='talk'; G.talk=cid;
  var lines=[{who:cid,text:t.greet||'……'}];
  // 可用问题：需要指定证物/证言、或问过某题后才出现
  var avail=[];
  t.questions.forEach(function(q,qi){
    if(q.need && !hasEv(q.need)) return;
    if(q.needFlag && !G.flags[q.needFlag]) return;
    if(q.after!==undefined && !G.flags['asked_'+t.id+'_'+q.after]) return;
    avail.push(qi);
  });
  var chs=avail.map(function(qi){
    var q=t.questions[qi], asked=G.flags['asked_'+t.id+'_'+qi];
    return {t:(asked?'· ':'◆ ')+q.q, act:function(){ askQ(t,qi) }};
  });
  if(!chs.length) chs.push({t:'（他现在没什么想说的了——先去别处找找线索）',act:function(){ dlgShow(false); G.phase='explore'; G.talk=null; renderAll() }});
  chs.push({t:'（结束对话）',act:function(){ dlgShow(false); G.phase='explore'; G.talk=null; renderAll() }});
  lines.push({who:cid,text:'',choices:chs});
  runLines(lines);
}
function askQ(t,qi){
  var q=t.questions[qi]; logAdd('询问：'+q.q+' → '+charOf(t.id).name);
  G.flags['asked_'+t.id+'_'+qi]=true;
  if(q.unlockFlag) G.flags[q.unlockFlag]=true;
  var lines=(q.a||[]).map(function(x){ return {who:x.w||t.id, text:x.t, ev:x.ev, flag:x.flag} });
  // 该问题若配置了"矛盾点"，询问后开放"出示证物"
  if(q.reveal) lines.push({who:null,text:'（这里似乎可以用证物反驳 —— 点右上「出示证物」。）',flag:'can_present_'+t.id+'_'+qi});
  lines.push({who:null,text:'',choices:[{t:'（继续问别的）',act:function(){ talkTo(t.id) }},
    {t:'（出示证物）',act:function(){ presentUI(function(evid){ presentTo(t,qi,evid) }) }}]});
  runLines(lines);
}
function presentUI(cb){
  var h='<h3>出示（物证或证言）</h3>';
  h+='<div class="evrow" style="border-color:#5d7fb8" data-cancel="1"><div class="ic">✕</div><div><b>取消</b></div></div>';
  var order=G.ev.slice().sort(function(a,b){
    var A=EVS[a]||{}, B=EVS[b]||{};
    return (A.type==='testimony'?0:1)-(B.type==='testimony'?0:1) });
  order.forEach(function(id){ var e=EVS[id]; if(!e) return;
    h+='<div class="evrow" data-ev="'+id+'"><div class="ic">'+evIcon(id,42)+'</div><div><b>'+e.name+
      (e.type==='testimony'?' <span style="color:#8fe08f;font-size:10.5px">证言</span>':'')+'</b><small>'+e.desc+'</small></div></div>' });
  openModal(h, function(target){
    if(target.getAttribute('data-cancel')){ closeModal(); return }
    var id=target.getAttribute('data-ev'); if(!id) return;
    closeModal(); cb(id);
  });
}
function presentTo(t,qi,evid){
  var q=t.questions[qi];
  var hit=(q.present||[]).filter(function(p){ return p.ev===evid })[0];
  if(hit){ addEv(evid); runLines(hit.lines, function(){ if(hit.flag) G.flags[hit.flag]=true; talkTo(t.id) }) }
  else { runLines([{who:t.id,text:(q.wrong||'……这跟我的事有什么关系？')}], function(){ talkTo(t.id) }) }
}
/* ---------- 法庭 ---------- */
function startFinale(){
  var C=curCase(); if(!C.court){ toast('本案不需要对质'); return }
  G.phase='court'; G.court={ idx:0, pressed:{}, wrong:0 };
  var _fb=(C.finaleBg||curScene().bg), _fsc=(C.finaleBg||curScene().id);
  $('sceneBg').style.backgroundImage='url(scene4/'+C.id+'_'+_fsc+'.jpg), url(scene3/'+C.id+'_'+_fsc+'.jpg), url(scene2/'+C.id+'_'+_fsc+'.jpg), url(scene/'+C.id+'_'+_fsc+'_v2.jpg), url(img/'+_fb+'.jpg), '+
    'linear-gradient(180deg,'+charColor(_fb)+',#0a0f1a)';
  $('locName').textContent='现场对质 · '+(C.culpritName||'凶手');
  clearChars(); removeHots(); renderHud(); renderCourt();
}
function renderCourt(){
  var C=curCase(), st=C.court.statements[G.court.idx];
  var who=charOf(st.who);
  // 证人站中间
  clearChars();
  $('charC').style.backgroundImage=bgOf(who.img||st.who); $('charC').className='on';
  var bar=$('courtBar'); bar.className=''; bar.innerHTML='';
  var b1=el('button','btn g','追问'); b1.onclick=function(){ pressStatement() };
  var b2=el('button','btn y','出示证物'); b2.onclick=function(){ presentUI(courtPresent) };
  var b3=el('button','btn g','证物'); b3.onclick=function(){ showEvidence() };
  bar.appendChild(b1); bar.appendChild(b2); bar.appendChild(b3);
  runLines([{who:null,text:'【证言 '+(G.court.idx+1)+'/'+C.court.statements.length+'】'},{who:st.who,text:st.text}]);
}
function pressStatement(){
  var C=curCase(), st=C.court.statements[G.court.idx];
  G.court.pressed[G.court.idx]=true;
  if(st.press){ runLines([{who:st.who,text:st.press}], function(){ renderCourt() }) }
  else runLines([{who:st.who,text:'（这有什么问题吗？）'}], function(){ renderCourt() });
}
function courtPresent(evid){
  var C=curCase(), st=C.court.statements[G.court.idx];
  if(st.ev===evid){
    objFlash(); G.court.pressed[G.court.idx]=true;
    var lines=[{who:null,text:'【异议成立！】'},{who:'det_shen',text:st.break_||'这句话和证物矛盾。'}];
    if(st.lines) lines=lines.concat(st.lines);
    runLines(lines, function(){
      G.court.idx++;
      if(G.court.idx>=C.court.statements.length){ caseSolved() } else renderCourt();
    });
  } else {
    G.court.wrong++; G.penalty--;
    if(G.penalty<=0){ runLines([{who:'pros_yan',text:'证据不足。法庭无法接受这样的推理。'},{who:'pros_yan',text:'……证据不足。他走了。'}], function(){ backToTitle() }); return }
    runLines([{who:st.who,text:'（他摇头）这和我刚才说的没有矛盾。（剩余机会 '+G.penalty+'）'}], function(){ renderCourt() });
  }
}
function objFlash(){ var o=$('obj'); o.className='on'; setTimeout(function(){ o.className='' },900);
  try{ beep(880,0.12,'square'); beep(1320,0.12,'square',0.13) }catch(e){} }
function caseSolved(){
  var C=curCase();
  G.done[C.id]=true; G.unlocked=Math.max(G.unlocked, (CASES.map(function(c){return c.id}).indexOf(C.id)+2));
  saveLS();
  runLines((C.ending||[]).concat([{who:null,text:'【案件告破】'+C.title}]), function(){
    openModal('<h3>案件告破</h3><div style="font-size:14px;line-height:1.8;color:#cfe0ff">'+
      C.truth+'</div><div style="margin-top:12px;text-align:center"><button class="btn" id="bk">返回案件列表</button></div>',
      function(t){ if(t.id==='bk'){ closeModal(); backToTitle() } });
  });
}
/* ---------- HUD / 弹层 ---------- */
function renderHud(){
  var h=$('hud'); h.innerHTML='';
  if(G.phase==='court'){ $('courtBar').className=''; return }

var AC=null;
function beep(f,dur,type,delay){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.value=f;
    var t0=AC.currentTime+(delay||0);
    g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(0.06,t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}
